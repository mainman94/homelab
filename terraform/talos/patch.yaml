# Shared configuration applied to every control plane node, on top of the
# generated base config and before the per-node patches in config.tf.
#
# On document formats: Talos 1.14 deprecates the v1alpha1 `machine:` /
# `cluster:` fields below in favour of single-purpose documents, but
# terraform-provider-talos 0.11 embeds the Talos machinery v1.13 SDK and
# rejects any document that SDK does not know — so the replacements are not
# reachable from here yet. The one that is, TimeSyncConfig, is used below.
# config.tf and readme.md have the detail.
machine:
  features:
    kubePrism:
      enabled: true
      port: 7445
  files:
    - op: create
      path: /etc/cri/conf.d/20-customization.part
      content: |
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false
cluster:
  allowSchedulingOnControlPlanes: true
  # Talos binds both to 127.0.0.1 by default, which leaves Prometheus unable to
  # scrape them and KubeSchedulerInstanceUnreachable /
  # KubeControllerManagerInstanceUnreachable firing forever. The secure ports
  # (10259 / 10257) still require authn + authz, so this exposes authenticated
  # TLS endpoints on the LAN, not open metrics.
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
  # Same story for etcd: without a metrics listener the kube-etcd Service in
  # kube-prometheus-stack never gets endpoints and the etcd dashboard stays
  # empty. 2381 is the metrics-only listener — read-only, no client certs, and
  # separate from the client (2379) and peer (2380) ports that stay mTLS.
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
  network:
    cni:
      name: none
  proxy:
    disabled: true
---
# Replaces the deprecated `machine.time`. Talos rejects a config that sets
# both, so the v1alpha1 block above must stay gone.
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  # Three rotations of the Austrian pool rather than one: each name is a
  # separate DNS rotation over the same set of servers, so a single one going
  # stale no longer leaves the node with nothing to compare against.
  servers:
    - at.pool.ntp.org
    - 0.at.pool.ntp.org
    - 1.at.pool.ntp.org
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: splunk-otel-collector-ingress
portSelector:
  ports:
    - 13133
  protocol: tcp
ingress:
  - subnet: 192.168.0.0/24
