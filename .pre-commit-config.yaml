# Local checks for the homelab IaC repo.
#
# Terraform runs happen in Terraform Cloud, so these hooks are about catching
# a broken stack before it gets that far. Anything that needs `terraform init`
# — validate, provider-aware tflint rules — pulls providers over the network
# on every run and is too slow for a commit hook; it lives in the Makefile
# (`make validate`) instead. `trivy` is likewise left to CI
# (.github/workflows/trivy.yml) and `make security`.
#
# Install once:  make hooks
# Run manually:  make lint
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-json
        # devcontainer.json is JSONC by spec — the format allows the
        # comments explaining each feature, which a strict JSON parser
        # will not accept.
        exclude: ^\.devcontainer/
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      # kubeconfig, talosconfig and *.tfvars are gitignored; this is the
      # backstop for a key pasted somewhere it should not be.
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
      # Core ruleset only (see .tflint.hcl); the provider rulesets need a
      # network fetch on every run. `make lint-deep` runs those.
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  # ansible-lint brings its own ansible-core, so no system ansible needed.
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        files: ^ansible/
        args: [--profile=production]
        # The hook pins python3.14 upstream; this follows whatever python3 the
        # machine has, which is what the dev container and CI provide.
        language_version: python3

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        # ansible/ is left to ansible-lint, which bundles its own yamllint and
        # expects the `---` document start that yamlfmt strips.
        exclude: ^ansible/

  # shellcheck-py ships the binary in a wheel, so the hook needs no Docker.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt-src
        args: [-i, "2", -ci]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
