name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The versions come from mise.toml, the same file the dev container
      # installs from; CI and the dev container both used to ask for `latest`.
      # install_args names only what this job needs — trivy is in mise.toml
      # for `make scan` and is the one tool aqua verifies through Sigstore, so
      # installing it here would make every lint run depend on the TUF CDN.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: terraform tflint python pre-commit actionlint shellcheck

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run every hook
        run: pre-commit run --all-files --show-diff-on-failure

  validate:
    name: validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - cloudflare
          - github
          - infrastructure
          - oci-free-cloud-k8s
          - openbao
          - pocket-id
          - talos
          - tfe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: terraform

      # -backend=false: state lives in Terraform Cloud and validate does not
      # need it, so this runs without any credentials.
      - name: Validate
        working-directory: terraform/${{ matrix.stack }}
        run: |-
          terraform init -backend=false -input=false
          terraform validate

  test:
    name: tftest (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only the stacks that have a tests/ directory. See AGENTS.md for why
        # that is currently just talos — the github stack cannot be tested
        # while its provider auth uses an ephemeral resource.
        stack:
          - talos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: terraform

      # The suites use mock_provider and only assert variable validation, so
      # they need no credentials — but providers still download before
      # `terraform test` can evaluate anything.
      - name: Test
        working-directory: terraform/${{ matrix.stack }}
        run: |-
          terraform init -backend=false -input=false
          terraform test
