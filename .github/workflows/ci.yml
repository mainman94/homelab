name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # terraform_fmt and terraform_tflint shell out to binaries the hooks do
      # not install themselves. Terraform, not OpenTofu: four stacks use
      # `ephemeral` blocks, which OpenTofu does not implement.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          # The wrapper rewrites stdout, which confuses the hooks.
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: Run every hook
        uses: pre-commit/action@v3.0.1

  validate:
    name: validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - cloudflare
          - github
          - infrastructure
          - oci-free-cloud-k8s
          - openbao
          - pocket-id
          - talos
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          terraform_wrapper: false

      # -backend=false: state lives in Terraform Cloud and validate does not
      # need it, so this runs without any credentials.
      - name: Validate
        working-directory: terraform/${{ matrix.stack }}
        run: |-
          terraform init -backend=false -input=false
          terraform validate
