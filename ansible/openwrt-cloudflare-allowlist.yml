# Restrict inbound 80/443 to Cloudflare's ranges.
#
# Cloudflare Access only enforces identity for traffic that actually reaches
# Cloudflare. Anyone hitting the public IP directly walks straight past it to
# the Cilium gateway. This closes that path at the router.
#
# Port-forwarded traffic traverses the forward chain, not input, so the rules
# below sit in wan -> lan. An input-zone rule would not affect it.
#
# Run with: ansible-playbook -i inventory/hosts.yml openwrt-cloudflare-allowlist.yml
---
- name: Allow inbound web traffic only from Cloudflare
  hosts: openwrt
  gather_facts: false
  # OpenWrt ships without python, so every task goes through raw.
  vars:
    web_ports: "80 443"

  tasks:
    - name: Install the ipset refresh script
      ansible.builtin.raw: |
        cat > /usr/libexec/cf-allowlist-update <<'CFEOF'
        {{ lookup('file', 'files/cf-allowlist-update.sh') }}
        CFEOF
        chmod +x /usr/libexec/cf-allowlist-update
      changed_when: true

    - name: Populate the ipsets
      ansible.builtin.raw: /usr/libexec/cf-allowlist-update
      changed_when: true

    # Ordering matters: fw4 evaluates rules in config order, so the accept must
    # precede the drop. Both are recreated on every run to keep that guaranteed.
    - name: Replace the allowlist rules
      ansible.builtin.raw: |
        for name in cf_allow_v4 cf_allow_v6 cf_drop; do
          uci -q delete firewall.$name || true
        done

        uci set firewall.cf_allow_v4=rule
        uci set firewall.cf_allow_v4.name='Allow-Web-Cloudflare-v4'
        uci set firewall.cf_allow_v4.src='wan'
        uci set firewall.cf_allow_v4.dest='lan'
        uci set firewall.cf_allow_v4.proto='tcp'
        uci set firewall.cf_allow_v4.family='ipv4'
        uci set firewall.cf_allow_v4.ipset='cf_v4'
        uci set firewall.cf_allow_v4.target='ACCEPT'
        {% for port in web_ports.split() %}
        uci add_list firewall.cf_allow_v4.dest_port='{{ port }}'
        {% endfor %}

        uci set firewall.cf_allow_v6=rule
        uci set firewall.cf_allow_v6.name='Allow-Web-Cloudflare-v6'
        uci set firewall.cf_allow_v6.src='wan'
        uci set firewall.cf_allow_v6.dest='lan'
        uci set firewall.cf_allow_v6.proto='tcp'
        uci set firewall.cf_allow_v6.family='ipv6'
        uci set firewall.cf_allow_v6.ipset='cf_v6'
        uci set firewall.cf_allow_v6.target='ACCEPT'
        {% for port in web_ports.split() %}
        uci add_list firewall.cf_allow_v6.dest_port='{{ port }}'
        {% endfor %}

        uci set firewall.cf_drop=rule
        uci set firewall.cf_drop.name='Drop-Web-Non-Cloudflare'
        uci set firewall.cf_drop.src='wan'
        uci set firewall.cf_drop.dest='lan'
        uci set firewall.cf_drop.proto='tcp'
        uci set firewall.cf_drop.target='DROP'
        {% for port in web_ports.split() %}
        uci add_list firewall.cf_drop.dest_port='{{ port }}'
        {% endfor %}

        uci commit firewall
        /etc/init.d/firewall reload
      changed_when: true

    # Cloudflare's ranges change rarely but they do change. A stale list drops
    # real traffic, so refresh daily.
    - name: Schedule the daily refresh
      ansible.builtin.raw: |
        grep -q cf-allowlist-update /etc/crontabs/root 2>/dev/null || \
          echo '17 4 * * * /usr/libexec/cf-allowlist-update' >> /etc/crontabs/root
        /etc/init.d/cron enable
        /etc/init.d/cron restart
      changed_when: true

    - name: Show the resulting ruleset
      ansible.builtin.raw: nft list chain inet fw4 forward_wan
      changed_when: false
